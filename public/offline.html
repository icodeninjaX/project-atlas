<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2867e8" />
    <title>Offline · Project Atlas</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #09090b;
        color: #fafafa;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid #27272a;
        border-radius: 24px;
        background: #111113;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #2867e8;
        font-size: 25px;
        font-weight: 800;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        margin-top: 24px;
        min-height: 44px;
        align-items: center;
        border-radius: 12px;
        padding: 0 16px;
        background: #2867e8;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>You’re offline</h1>
      <p>
        This screen has not been saved on this device yet. Previously visited
        Atlas screens are still available, and saved changes will sync when your
        connection returns.
      </p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
