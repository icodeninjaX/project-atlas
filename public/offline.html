<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2867e8" />
    <title>Offline · ATLAS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #070a0f;
        color: #f4f7fb;
      }
      main {
        width: min(100%, 400px);
        padding: 28px;
        border: 1px solid #202a39;
        border-radius: 16px;
        background: #0e131c;
      }
      .wordmark {
        margin: 0;
        color: #8d99aa;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3em;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #8d99aa;
        font-size: 14px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        margin-top: 24px;
        min-height: 44px;
        align-items: center;
        border-radius: 12px;
        padding: 0 16px;
        background: #2b66f2;
        color: white;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark" aria-hidden="true">ATLAS</p>
      <h1>You’re offline</h1>
      <p>
        This screen has not been saved on this device yet. Screens you have
        visited are still available, and saved changes sync when your connection
        returns.
      </p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
